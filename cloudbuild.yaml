steps:
  # 1. Constrói a imagem do container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/requisicoes-bcms:latest', '.']

  # 2. Envia a imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/requisicoes-bcms:latest']

  # 3. Implanta no Cloud Run (região São Paulo ou us-central1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'requisicoes-bcms'
      - '--image'
      - 'gcr.io/$PROJECT_ID/requisicoes-bcms:latest'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'REQEMP_HOSTS=*'

images:
  - 'gcr.io/$PROJECT_ID/requisicoes-bcms:latest'
